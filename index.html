  <section class="section overview-section" aria-labelledby="overview-title"><div class="section-heading"><div><h2 id="overview-title">五科作答概覽</h2><p class="muted small">各科選擇題逐題通過率的算術平均；差距為學校平均減比較基準平均，單位為％。</p></div><span class="muted small">條形圖共用 0–100% 尺度</span></div><div class="overview-grid" id="overview"></div><div class="notice">逐題通過率均值不是測驗總分，也不是跨科能力排名。各科題目、難度與資料涵蓋不同；英語閱讀與聽力分開呈現，數學非選擇題另列。全縣市指桃園市。全國與桃園市比較通過率為來源兩位小數；學校採詳細表四位小數，差距標示為約數。</div></section>

":0.6956,"counts":{"blank":0,"multiple":0,"A":16,"B":313,"C":68,"D":53},"maxWrongRate":0.1511111111111111,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":27},"精熟":{"n":129,"rate":0.8682,"counts":{"blank":0,"multiple":0,"A":0,"B":112,"C":10,"D":7},"maxWrongRate":0.07751937984496124,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":27},"基礎":{"n":292,"rate":0.6712,"counts":{"blank":0,"multiple":0,"A":12,"B":196,"C":47,"D":37},"maxWrongRate":0.16095890410958905,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":27},"待加強":{"n":29,"rate":0.1724,"counts":{"blank":0,"multiple":0,"A":4,"B":5,"C":11,"D":9},"maxWrongRate":0.3793103448275862,"maxWrongOptions":["C"],"highWrongOptions":["C","D"],"sourceRow":27}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下資料，並回答26～29題：<\/p><table class=\"source-table\"><tr><td><p>【甲】<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-a12125996cdac6af9eb9.jpg\" alt=\"來源圖像 image16.jpeg\" style=\"width:272.1px;max-width:100%;height:auto;vertical-align:middle\">        2050年全球將有七成的人居住在城市，城市必須供養70億人口，但密集開發的城市哪還有多餘的土地可耕作？為解決城市糧食供應的問題，垂直農場應運而生。<\/p><p>城市垂直農場是把水平的農場，改造成種滿植物的摩天大樓，用營養液代替土壤，用LED燈取代陽光，這些彷彿科幻小說的情節，在專家的努力下正一步步成真。垂直農法在密閉的室內種植農作物，壓縮了空間，讓效益極大化，節約土地也節約用水量，用水僅是傳統土壤種植的十分之一。而樓上種菜、樓下賣菜的經營方式，縮短了食物里程，減少了長途運送的資源浪費。<\/p><p>        垂直農場發想者的本意在解決全人類的問題，然而這種耕作方法現階段仍有個無法克服的難關，就是生產成本太高。目前只能為少數人服務，無法養活全世界。全球人口稠密的城市，有四分之三分布在<u>亞洲<\/u>，因此相較其他地方，<u>亞洲<\/u>的大都市更加支持垂直農場的發展。<\/p><p>──改寫自〈未來城市──垂直農場〉<\/p><p>【乙】<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-3d046512f3f0e2fa298e.jpg\" alt=\"來源圖像 image17.jpeg\" style=\"width:242.3px;max-width:100%;height:auto;vertical-align:middle\">        <u>荷蘭<\/u>某業者耗鉅資三億<u>歐<\/u>元，打造全球第一座海岸漂浮牧場。業者認為把牧場搬到城市的河岸或海岸線，一來節能減碳，二來也為氣候變遷海平面上升、土地減少的問題找到解決之道。<\/p><p>這座位於<u>鹿特丹<\/u>港邊的建築，可說是<u>荷蘭<\/u>循環經濟的展示間。它的屋頂可收集雨水，旁邊的太陽能面板，可提供整棟建築所需的四成電力。①<u>上層的空間可容納<\/u><u>40<\/u><u>頭乳牛，一天約產出<\/u><u>800<\/u><u>公升的鮮奶<\/u>，②<u>乳牛的飼料來自當地高爾夫球場、運動場修剪後的草屑以及啤酒廠用過的穀物、麩<\/u>，全部自動收割混合後，再定時、定量送到乳牛面前。③<u>連擠牛奶和清理排泄物的工作，也都由機器代勞<\/u>，且乳牛的排泄物會被回收再製成肥料。樓層中設有加工區，④<u>可直接將乳製品銷往當地，減少運輸成本<\/u>。參觀者也可在現場按下開關直接購買未經高溫消毒的鮮奶。<\/p><p>        但也有研究人員指出這種模式可能較適合用在農業而非畜牧業。「乳牛應該在自然棲息地漫步。現在把牠們搬到非常工業化的環境，對許多人而言，會認為這不是對待牠們應有的方式。」<\/p><p>──改寫自〈鹿特丹海岸漂浮牧場落成開放參觀〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據甲文，下列關於垂直農場的推論，何者最恰當？<\/p><p>(A)產量與用水量皆高出土壤種植方式<\/p><p>(B)受天然風災直接的影響少於傳統農業<\/p><p>(C)<u>亞洲<\/u>因生產成本較低，更適合垂直農場的發展<\/p><p>(D)2050年全球將有七成的人必須吃垂直農場栽種的蔬菜<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第28個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":27,"ability":"文意理解"},{"qid":"27","number":27,"kind":"choice","target":"能應用文本","basis":"學習表現：5-Ⅳ-4、\n學習內容Ad-Ⅳ-2","answer":"B","school":0.8889,"national":0.87,"city":0.86,"deltaNational":0.0189,"deltaCity":0.0289,"groups":{"全體":{"n":450,"rate":0.8889,"counts":{"blank":0,"multiple":0,"A":24,"B":400,"C":18,"D":8},"maxWrongRate":0.05333333333333334,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":28},"精熟":{"n":129,"rate":0.9767,"counts":{"blank":0,"multiple":0,"A":3,"B":126,"C":0,"D":0},"maxWrongRate":0.023255813953488372,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":28},"基礎":{"n":292,"rate":0.8836,"counts":{"blank":0,"multiple":0,"A":14,"B":258,"C":16,"D":4},"maxWrongRate":0.0547945205479452,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":28},"待加強":{"n":29,"rate":0.5517,"counts":{"blank":0,"multiple":0,"A":7,"B":16,"C":2,"D":4},"maxWrongRate":0.2413793103448276,"maxWrongOptions":["A"],"highWrongOptions":["A"],"sourceRow":28}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下資料，並回答26～29題：<\/p><table class=\"source-table\"><tr><td><p>【甲】<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-a12125996cdac6af9eb9.jpg\" alt=\"來源圖像 image16.jpeg\" style=\"width:272.1px;max-width:100%;height:auto;vertical-align:middle\">        2050年全球將有七成的人居住在城市，城市必須供養70億人口，但密 ，<u>亞洲<\/u>的大都市更加支持垂直農場的發展。<\/p><p>──改寫自〈未來城市──垂直農場〉<\/p><p>【乙】<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-3d046512f3f0e2fa298e.jpg\" alt=\"來源圖像 image17.jpeg\" style=\"width:242.3px;max-width:100%;height:auto;vertical-align:middle\">        <u>荷蘭<\/u>某業者耗鉅資三億<u>歐<\/u>元，打造全球第一座海岸漂浮牧場。業者認為把牧場搬到城市的河岸或海岸線，一來節能減碳，二來也為氣候變遷海平面上升、土地減少的問題找到解決之道。<\/p><p>這座位於<u>鹿特丹<\/u>港邊的建築，可說是<u>荷蘭<\/u>循環經濟的展示間。它的屋頂可收集雨水，旁邊的太陽能面板，可提供整棟建築所需的四成電力。①<u>上層的空間可容納<\/u><u>40<\/u><u>頭乳牛，一天約產出<\/u><u>800<\/u><u>公升的鮮奶<\/u>，②<u>乳牛的飼料來自當地高爾夫球場、運動場修剪後的草屑以及啤酒廠用過的穀物、麩<\/u>，全部自動收割混合後，再定時、定量送到乳牛面前。③<u>連擠牛奶和清理排泄物的工作，也都由機器代勞<\/u>，且乳牛的排泄物會被回收再製成肥料。樓層中設有加工區，④<u>可直接將乳製品銷往當地，減少運輸成本<\/u>。參觀者也可在現場按下開關直接購買未經高溫消毒的鮮奶。<\/p><p>        但也有研究人員指出這種模式可能較適合用在農業而非畜牧業。「乳牛應該在自然棲息地漫步。現在把牠們搬到非常工業化的環境，對許多人而言，會認為這不是對待牠們應有的方式。」<\/p><p>──改寫自〈鹿特丹海岸漂浮牧場落成開放參觀〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據甲、乙二文，「垂直農場」與「漂浮牧場」共同的特點<u>不包含<\/u>下列何者？<\/p><p>(A)可以減少食物里程<\/p><p>(B)設置地點都在城市<\/p><p>(C)生產所需的資金成本高<\/p><p>(D)運作時需投入大量人力<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第31個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":30,"ability":"文本評鑑"},{"qid":"30","number":30,"kind":"choice","target":"能理解文意","basis":"學習表現：5-Ⅳ-2、\n學習內容Ad-Ⅳ-2","answer":"D","school":0.9022,"national":0.84,"city":0.84,"deltaNational":0.0622,"deltaCity":0.0622,"groups":{"全體":{"n":450,"rate":0.9022,"counts":{"blank":0,"multiple":0,"A":24,"B":12,"C":8,"D":406},"maxWrongRate":0.05333333333333334,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":31},"精熟":{"n":129,"rate":1,"counts":{"blank":0,"multiple":0,"A":0,"B":0,"C":0,"D":129},"maxWrongRate":0,"maxWrongOptions":["A","B","C"],"highWrongOptions":[],"sourceRow":31},"基礎":{"n":292,"rate":0.9178,"counts":{"blank":0,"multiple":0,"A":11,"B":6,"C":7,"D":268},"maxWrongRate":0.03767123287671233,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":31},"待加強":{"n":29,"rate":0.3103,"counts":{"blank":0,"multiple":0,"A":13,"B":6,"C":1,"D":9},"maxWrongRate":0.4482758620689655,"maxWrongOptions":["A"],"highWrongOptions":["A","B"],"sourceRow":31}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下文章，並回答30～32題：<\/p><table class=\"source-table\"><tr><td><p>　　親愛的<u>馬爾萬<\/u>，在我童年的漫長夏天裡，那時我跟你現在一樣大，你叔叔們和我會在你爺爺的農舍屋頂上鋪開床墊，那是在<u>霍姆斯<\/u>城郊外。<\/p><p>　　<u>馬爾萬<\/u>，①<u>我希望你和我一樣記住霍姆斯<\/u>。在它繁華的老城，有一座我們<u>穆斯林<\/u>的清真寺，一座我們<u>基督<\/u>徒鄰居的教堂，還有一座我們所有人的大市場，我們在那裡為金項鍊和新鮮食材以及新娘禮服討價還價。<\/p><p>　　我希望你記得那滿是炸羊肉丸子味道的擁擠小巷，還有那些晚上，②<u>我們和你媽媽一起在鐘樓廣場附近散步<\/u>。但是那樣的生活，那個時候，現在看來都像是夢，就算對我來說，都像消失很久的傳聞。<\/p><p>　　先是抗議示威，然後是被圍困。天空布滿炸彈，到處是飢餓的人民，與接連不斷的葬禮，這些你是知道的。你知道的那些母親們、姊妹們和同學們有可能被埋在水泥、磚塊和外露的房梁間的狹窄細縫裡，陽光照射下的小塊皮膚在黑暗中閃閃發光。<\/p><p>　　你媽媽今晚也在這裡，<u>馬爾萬<\/u>，和我們在一起。在這寒冷的月光照耀的海灘上，在啼哭的嬰兒中間，在憂慮地說著我們不會講的語言的女人中間。<u>阿富汗<\/u>人、<u>索馬利亞<\/u>人、<u>伊拉克<\/u>人還有<u>敘利亞<\/u>人，我們所有人都在焦急地等待日出，所有人又在害怕日出，我們所有人都在尋找家園。<\/p><p>　　我聽說我們是不速之客，我們是不受歡迎的，我們應該把災禍帶到別處去。但我聽到了你媽媽的聲音，越過潮水，她在我耳邊低語：「噢，如果他們看見，親愛的，哪怕只有你所見的一半，只要他們能看見，他們一定會說出善意的話的。」<\/p><p>　　我看見你的側臉，在下弦月的光輝中，我的孩子，你的睫毛就像<u>阿拉伯<\/u>書法一樣，在你沉靜的睡眠中緊閉著。我對你說：「抓住我的手，不會有壞事發生。」<\/p><p>　　我今夜能想到的，是海有多深，多寬廣，多冷漠。我是多麼無能為力，沒能在它面前保護好你。我能做的就是祈禱，祈禱真主讓船航行在正確的方向。③<u>當海岸退出視野，我們只是波濤中的一個小點<\/u>，一旦絆倒或站不穩，很容易就會被吞沒。<\/p><p>　　因為你，是珍貴的船貨，<u>馬爾萬<\/u>。④<u>有史以來最珍貴的船貨<\/u>。<\/p><p>　　我多麼希望大海能明白這一點。<\/p><p>——改寫自<u>卡勒德<\/u><u>．<\/u><u>胡賽尼<\/u>《海的祈禱》<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，畫線處的文句何者最能看出爸爸對孩子的重視？<\/p><p>(A) ①<\/p><p>(B) ②<\/p><p>(C) ③<\/p><p>(D) ④<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第33個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":31,"ability":"文意理解"},{"qid":"31","number":31,"kind":"choice","target":"能理解文意","basis":"學習表現：5-Ⅳ-3、\n學習內容Ad-Ⅳ-2","answer":"C","school":0.8622,"national":0.81,"city":0.81,"deltaNational":0.0522,"deltaCity":0.0522,"groups":{"全體":{"n":450,"rate":0.8622,"counts":{"blank":0,"multiple":0,"A":24,"B":28,"C":388,"D":10},"maxWrongRate":0.06222222222222222,"maxWrongOptions":["B"],"highWrongOptions" <p>　　我看見你的側臉，在下弦月的光輝中，我的孩子，你的睫毛就像<u>阿拉伯<\/u>書法一樣，在你沉靜的睡眠中緊閉著。我對你說：「抓住我的手，不會有壞事發生。」<\/p><p>　　我今夜能想到的，是海有多深，多寬廣，多冷漠。我是多麼無能為力，沒能在它面前保護好你。我能做的就是祈禱，祈禱真主讓船航行在正確的方向。③<u>當海岸退出視野，我們只是波濤中的一個小點<\/u>，一旦絆倒或站不穩，很容易就會被吞沒。<\/p><p>　　因為你，是珍貴的船貨，<u>馬爾萬<\/u>。④<u>有史以來最珍貴的船貨<\/u>。<\/p><p>　　我多麼希望大海能明白這一點。<\/p><p>——改寫自<u>卡勒德<\/u><u>．<\/u><u>胡賽尼<\/u>《海的祈禱》<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>關於本文的寫作分析，下列敘述何者最恰當？<\/p><p>(A)藉記憶中的畫面，呈現<u>霍姆斯<\/u>的今昔變化<\/p><p>(B)列舉多個國家的名稱，凸顯了航程的漫長<\/p><p>(C)以等待日出的場景，傳達近鄉情怯的不安<\/p><p>(D)透過海的深廣，比喻母親話中溫暖的力量<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第35個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":33,"ability":"文本評鑑"},{"qid":"33","number":33,"kind":"choice","target":"能理解文意","basis":"學習表現：5-Ⅳ-3、\n學習內容Ad-Ⅳ-2","answer":"C","school":0.8533,"national":0.83,"city":0.82,"deltaNational":0.0233,"deltaCity":0.0333,"groups":{"全體":{"n":450,"rate":0.8533,"counts":{"blank":1,"multiple":0,"A":37,"B":18,"C":384,"D":10},"maxWrongRate":0.08222222222222222,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":34},"精熟":{"n":129,"rate":0.9922,"counts":{"blank":0,"multiple":0,"A":0,"B":0,"C":128,"D":1},"maxWrongRate":0.007751937984496124,"maxWrongOptions":["D"],"highWrongOptions":[],"sourceRow":34},"基礎":{"n":292,"rate":0.839,"counts":{"blank":1,"multiple":0,"A":28,"B":14,"C":245,"D":4},"maxWrongRate":0.0958904109589041,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":34},"待加強":{"n":29,"rate":0.3793,"counts":{"blank":0,"multiple":0,"A":9,"B":4,"C":11,"D":5},"maxWrongRate":0.3103448275862069,"maxWrongOptions":["A"],"highWrongOptions":["A"],"sourceRow":34}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答33～34題：<\/p><table class=\"source-table\"><tr><td><p><u>唐玄宗<\/u>時，翰林有三種：翰林待詔、翰林供奉、翰林學士。<\/p><p>翰林待詔這個群體很雜，有詩人，有畫家，有經學家，有書法家，有醫生，還有算命先生。這些人被<u>唐玄宗<\/u>包養起來，辦公之餘，或者出遊的時候，把他們喊過去，陪著玩耍，說穿了，就是「幫閒」。<\/p><p>翰林供奉是翰林待詔裡的佼佼者，譬如說，你寫文章寫得非常漂亮，遠遠超過別的翰林待詔，皇帝喊你喊得特別頻繁，今天讓你寫這個，明天讓你寫那個，甚至讓你幫他處理奏章，那麼你就成了翰林供奉。<\/p><p>翰林學士又是翰林供奉裡的佼佼者，不光文筆一流，還通曉政治。朝廷把這批人才從待詔和供奉裡發掘出來，讓他們單獨辦公。<\/p><p>不管是翰林待詔、翰林供奉，還是翰林學士，都沒有專門的品級。不過翰林學士一般兼有其他職務，既是翰林學士，又是戶部尚書、禮部尚書、兵部侍郎、吏部侍郎等等。雖然翰林學士不領薪水，但是尚書、侍郎卻有不菲的薪水。翰林待詔和翰林供奉大都不兼職，可是他們卻有薪水，其中翰林待詔的薪水參照九品京官，翰林供奉的薪水參照八品京官。<\/p><p>——改寫自<u>李開周<\/u>〈翰林的薪水〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>關於文中翰林供奉的敘述，下列何者最恰當？<\/p><p>(A)可獨立辦公<\/p><p>(B)有很多兼職收入<\/p><p>(C)薪水比照八品京官<\/p><p>(D)不能幫皇帝處理奏章<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第37個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":34,"ability":"文意理解"},{"qid":"34","number":34,"kind":"choice","target":"能根據文本推論","basis":"學習表現：5-Ⅳ-3、\n學習內容Ad-Ⅳ-2","answer":"B","school":0.7911,"national":0.77,"city":0.77,"deltaNational":0.0211,"deltaCity":0.0211,"groups":{"全體":{"n":450,"rate":0.7911,"counts":{"blank":1,"multiple":0,"A":28,"B":356,"C":45,"D":20},"maxWrongRate":0.1,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":35},"精熟":{"n":129,"rate":0.9922,"counts":{"blank":0,"multiple":0,"A":0,"B":128,"C":1,"D":0},"maxWrongRate":0.007751937984496124,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":35},"基礎":{"n":292,"rate":0.7603,"counts":{"blank":1,"multiple":0,"A":23,"B":222,"C":33,"D":13},"maxWrongRate":0.11301369863013698,"maxWrongOptions":["C"],"highWrongOptions":[],"sourceRow":35},"待加強":{"n":29,"rate":0.2069,"counts":{"blank":0,"multiple":0,"A":5,"B":6,"C":11,"D":7},"maxWrongRate":0.3793103448275862,"maxWrongOptions":["C"],"highWrongOptions":["C","D"],"sourceRow":35}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答33～34題：<\/p><table class=\"source-table\"><tr><td><p><u>唐玄宗<\/u>時，翰林有三種：翰林待詔、翰林供奉、翰林學士。<\/p><p>翰林待詔這個群體很雜，有詩人，有畫家，有經學家，有書法家，有醫生，還有算命先生。這些人被<u>唐玄宗<\/u>包養起來，辦公之餘，或者出遊的時候，把他們喊過去，陪著玩耍，說穿了，就是「幫閒」。<\/p><p>翰林供奉是翰林待詔裡的佼佼者，譬如說，你寫文章寫得非常漂亮，遠遠超過別的翰林待詔，皇帝喊你喊得特別頻繁，今天讓你寫這個，明天讓你寫那個，甚至讓你幫他處理奏章，那麼你就成了翰林供奉。<\/p><p>翰林學士又是翰林供奉裡的佼佼者，不光文筆一流，還通曉政治。朝廷把這批人才從待詔和供奉裡發掘出來，讓他們單獨辦公。<\/p><p>不管是翰林待詔、翰林供奉，還是翰林學士，都沒有專門的品級。不過翰林學士一般兼有其他職務，既是翰林學士，又是戶部尚書、禮部尚書、兵部侍郎、吏部侍郎等等。雖然翰林學士不領薪水，但是尚書、侍郎卻有不菲的薪水。翰林待詔和翰林供奉大都不兼職，可是他們卻有薪水，其中翰林待詔的薪水參照九品京官，翰林供奉的薪水參照八品京官。<\/p><p>——改寫自<u>李開周<\/u>〈翰林的薪水〉<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，下列推論何者最恰當？<\/p><p>(A)尚書和侍郎通常也兼任翰林供奉<\/p><p>(B)翰林學士處理政務的能力優於翰林供奉<\/p><p>(C)翰林待詔是<u>唐玄宗<\/u>重要的行政幕僚之一<\/p><p>(D)翰林待詔與翰林學士的差別在專門品級的高低<\/p><\/div>","note":"來源：034502_國文科試題分析_國民中學版.docx，本文第38個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":35,"ability":"文意理解"},{"qid":"35","number":35,"kind":"choice","target":"能理解文意","basis":"學習表現：5-Ⅳ-3、\n學習內容Ad-Ⅳ-2","answer":"C","school":0.7444,"national":0.71,"city":0.71,"deltaNational":0.0344,"deltaCity":0.0344,"groups":{"全體":{"n":450,"rate":0.7444,"counts":{"blank":1,"multiple":0,"A":11,"B":29,"C":335,"D":74},"maxWrongRate":0.16444444444444445,"maxWrongOptions":["D"],"highWrongOptions":[],"sourceRow":36},"精熟":{"n":129,"rate":0.938,"counts":{"blank":0,"multiple":0,"A":2,"B":0,"C":121,"D":6},"maxWrongRate":0.046511627906976744,"maxWrongOptions":["D"],"highWrongOptions":[],"sourceRow":36},"基礎":{"n":292,"rate":0.6918,"counts":{"blank":1,"multiple":0,"A":6,"B":20,"C":202,"D":63},"maxWrongRate":0.21575342465753425,"maxWrongOptions":["D"],"highWrongOptions":["D"],"sourceRow":36},"待加強":{"n":29,"rate":0.4138,"counts":{"blank":0,"multiple":0,"A":3,"B":9,"C":12,"D":5},"maxWrongRate":0.3103448275862069,"maxWrongOptions":["B"],"highWrongOptions":["B"],"sourceRow":36}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下資料，並回答35～36題：<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9e0a723bcb72938e24df.jpg\" alt=\"來源圖像 image18.jpeg\" style=\"width:598.2px;max-width:100%;height:auto;vertical-align:middle\"> <\/p><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，下列關於投壺的敘述何者最恰當？<\/p><p>(A)主人要讓分給客人<\/p><p>(B)由先<u>秦<\/u>的娛樂競技演變而來<\/p><p>(C)參賽者各以四箭算一局勝負<\/p><p>(D)司正以三局分數的總和判定贏家<\/p><\/div>","note": l,"sourceRow":37,"ability":"文本評鑑"},{"qid":"37","number":37,"kind":"choice","target":"能理解文意","basis":"學習表現：5-Ⅳ-3、\n學習內容Bc-Ⅳ-1","answer":"C","school":0.8422,"national":0.8,"city":0.8,"deltaNational":0.0422,"deltaCity":0.0422,"groups":{"全體":{"n":450,"rate":0.8422,"counts":{"blank":1,"multiple":0,"A":9,"B":41,"C":379,"D":20},"maxWrongRate":0.09111111111111111,"maxWrongOptions":["B"],"highWrongOptions":[],"sourceRow":38},"精熟":{"n":129,"rate":0.969,"counts":{"blank":0,"multiple":0,"A":0,"B":2,"C":125,"D":2},"maxWrongRate":0.015503875968992248,"maxWrongOptions":["B","D"],"highWrongOptions":[],"sourceRow":38},"基礎":{"n":292,"rate":0.8322,"counts":{"blank":1,"multiple":0,"A":7,"B":28,"C":243,"D":13},"maxWrongRate":0.0958904109589041,"maxWrongOptions":["B"],"highWrongOptions":[],"sourceRow":38},"待加強":{"n":29,"rate":0.3793,"counts":{"blank":0,"multiple":0,"A":2,"B":11,"C":11,"D":5},"maxWrongRate":0.3793103448275862,"maxWrongOptions":["B"],"highWrongOptions":["B"],"sourceRow":38}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><p><br>請閱讀以下短文，並回答37～38題：<\/p><table class=\"source-table\"><tr><td><p>        <u>東非<\/u>草原上，鐮莢金合歡樹提供原生舉尾蟻花蜜與住所，而舉尾蟻會保護金合歡免受食草性動物侵害，並攻擊啃食金合歡的<u>非洲<\/u>象。21世紀初，外來的熱帶大頭家蟻突然出現在<u>肯亞<\/u>，牠們會殺死舉尾蟻並吃掉其幼體，讓<u>非洲<\/u>象得以肆無忌憚地啃食金合歡。<\/p><p>        另一方面，金合歡減少，也令獅子在捕獵斑馬時難以掩蔽。研究團隊為了解金合歡減少是否會影響獅子獵食，在<u>肯亞<\/u>保護區的稀樹草原上建立十幾個研究區塊，追蹤金合歡景觀變化、斑馬族群密度、熱帶大頭家蟻出現情況以及獅子殺死斑馬的情況。<\/p><p>        經過3年的監測，團隊發現沒有舉尾蟻的金合歡被<u>非洲<\/u>象破壞的速度，比有舉尾蟻的樹快5～7倍。這些區域的金合歡覆蓋面積急劇減少，使獅子很難偷偷靠近並伏擊斑馬。而沒有熱帶大頭家蟻入侵的地區，斑馬遭獅子獵殺的情況較前者高出兩倍以上。<\/p><p>        令人驚訝的是，雖然接觸主要獵物的機會減少，但研究區域的獅子數量卻保持穩定。根據其他研究數據，團隊發現當地獅子另外增加捕獵的對象：從2003年到2020年，獅子獵殺斑馬的比例從67%下降到42%，而獵殺水牛的比例從0%增加到42%。<\/p><p>針對這樣的結果，專家認為：這些入侵的螞蟻可能早就出現，但沒有人注意。我們現在發現牠們以非常微妙的方式改變了生態景觀。<\/p><p>——改寫自《Science》2024年1月號<\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據本文，關於熱帶大頭家蟻入侵<u>肯亞<\/u>保護區後的生態變化，下列敘述何者最恰當？<\/p><p>(A)獅子數量減少<\/p><p>(B)斑馬易受獅子攻擊<\/p><p>(C)金合歡易受大象破壞<\/p><p>(D)舉尾蟻不再攻擊大象<\/p><\/div>","note":"來源： "來源圖像 image233.wmf\" style=\"width:18.0px;max-width:100%;height:auto;vertical-align:middle\">即為所求<\/p><p><div class=\"source-textbox\"><p>圖(十一)<\/p><\/div>【乙】作<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-16faa05df6e2431a4c4c.png\" alt=\"來源圖像 image234.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">、<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-3b66f4b8d05c5bc07820.png\" alt=\"來源圖像 image235.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">的角平分線，兩直線相交於<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-ef5bda52c144d826692b.png\" alt=\"來源圖像 image236.wmf\" style=\"width:18.0px;max-width:100%;height:auto;vertical-align:middle\">點，<br>則<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-ef5bda52c144d826692b.png\" alt=\"來源圖像 image237.wmf\" style=\"width:18.0px;max-width:100%;height:auto;vertical-align:middle\">即為所求<\/p><p>對於甲、乙兩人的作法，下列判斷何者正確？<br>(A)甲、乙皆正確<br>(B)甲、乙皆錯誤<br>(C)甲正確，乙錯誤<br>(D)甲錯誤，乙正確<\/p><\/div>","note":"來源：034502_數學科試題分析_國民中學版.docx，本文第24個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":23,"ability":"分析思考"},{"qid":"23","number":23,"kind":"choice","target":"評量學生是否能在生活情境中應用不等式解決問題","basis":"學習表現：a-IV-3、\n學習內容A-7-8","answer":"B","school":0.4378,"national":0.47,"city":0.46,"deltaNational":-0.0322,"deltaCity":-0.0222,"groups":{"全體":{"n":450,"rate":0.4378,"counts":{"blank":1,"multiple":0,"A":136,"B":197,"C":47,"D":69},"maxWrongRate":0.3022222222222222,"maxWrongOptions":["A"],"highWrongOptions":["A"],"sourceRow":24},"精熟":{"n":116,"rate":0.8103,"counts":{"blank":0,"multiple":0,"A":22,"B":94,"C":0,"D":0},"maxWrongRate":0.1896551724137931,"maxWrongOptions":["A"],"highWrongOptions":[],"sourceRow":24},"基礎":{"n":235,"rate":0.3872,"counts":{"blank":1,"multiple":0,"A":74,"B":91,"C":29,"D":40},"maxWrongRate":0.3148936170212766,"maxWrongOptions":["A"],"highWrongOptions":["A"],"sourceRow":24},"待加強":{"n":99,"rate":0.1212,"counts":{"blank":0,"multiple":0,"A":40,"B":12,"C":18,"D":29},"maxWrongRate":0.40404040404040403,"maxWrongOptions":["A"],"highWrongOptions":["A","D"],"sourceRow":24}},"doc":{"html":"<section class=\"shared-material\"><h4>題組共用材料<\/h4><table class=\"source-table\"><tr><td><p>第 23~25 題選文<\/p><\/td><\/tr><tr><td><p><div class=\"source-textbox\"><p>圖(十二)<\/p><\/div><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-f291648fcf3a596f29cd.jpg\" alt=\"來源圖像 image238.jpeg\" style=\"max-width:100%;height:auto;vertical-align:middle\">汽車上會安裝圖(十二)的時速錶，其功能是指示汽車當時的速率，但<br>其指示的速率並不一定等於汽車的實際速率。已知法規規範車輛出廠時，<br>時速錶的指示速率(<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-19abd36b9156632ab972.png\" alt=\"來源圖像 image239.wmf\" style=\"width:23.0px;max-width:100%;height:auto;vertical-align:middle\">)必須永不小於車輛的實際速率(<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bb911b2bc884052c7da8.png\" alt=\"來源圖像 image240.wmf\" style=\"width:25.0px;max-width:100%;height:auto;vertical-align:middle\">)，且<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-19abd36b9156632ab972.png\" alt=\"來源圖像 image239.wmf\" style=\"width:23.0px;max-width:100%;height:auto;vertical-align:middle\">與<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bb911b2bc884052c7da8.png\" alt=\"來源圖像 image240.wmf\" style=\"width:25.0px;max-width:100%;height:auto;vertical-align:middle\"><br>應滿足下列關係：<\/p><table class=\"source-table\"><tr><td><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-6c5c80060dc5d5969fe2.png\" alt=\"來源圖像 image241.wmf\" style=\"width:127.0px;max-width:100%;height:auto;vertical-align:middle\"><\/p><p>(皆以公里/小時為速率單位)<\/p><\/td><\/tr><\/table><p>而車輛的實際速率就是單位時間內車輛移動的距離，可以利用輪胎轉速與輪胎周長求出。輪胎轉速是指單位時間內輪胎旋轉多少圈，而輪胎周長等於輪胎旋轉一圈時車輛移動的距離，所以有下列關係式：<\/p><table class=\"source-table\"><tr><td><p>實際速率＝輪胎轉速<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9afcf0a31df4052df82f.png\" alt=\"來源圖像 image242.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">輪胎周長<\/p><\/td><\/tr><\/table><p>上式的實際速率若要以公里/小時為單位，則輪胎轉速應以圈/小時為單位，輪胎周長應以公里為單位。<\/p><p>所以當車輛上的儀器測出輪胎轉速，配合儀器內設定的輪胎周長，就能得到時速錶上的指示速率，關係式如下：<\/p><table class=\"source-table\"><tr><td><p>指示速率＝儀器測出的輪胎轉速<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9afcf0a31df4052df82f.png\" alt=\"來源圖像 image243.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">儀器設定的輪胎周長<\/p><\/td><\/tr><\/table><p><div class=\"source-textbox\"><p>&amp;圈/小時為轉速單位，表示每小時轉多少圈<\/p><\/div><\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據選文，時速錶符合法規的汽車行駛時，若指示速率為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image244.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">公里/小時，則實際速率的最小值與最大值分別是多少公里/小時？(最小值用無條件進入法取概數到個位，最大值用無條件捨去法取概數到個位)<br>(A)最小值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-f68203492b6364dc65d8.png\" alt=\"來源圖像 image245.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">，最大值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image246.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\"><br>(B)最小值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-047db7c049ec4d3e912c.png\" alt=\"來源圖像 image247.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">，最大值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image248.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\"><br>(C)最小值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image249.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">，最大值<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/ idth:25.0px;max-width:100%;height:auto;vertical-align:middle\">)，且<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-19abd36b9156632ab972.png\" alt=\"來源圖像 image239.wmf\" style=\"width:23.0px;max-width:100%;height:auto;vertical-align:middle\">與<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bb911b2bc884052c7da8.png\" alt=\"來源圖像 image240.wmf\" style=\"width:25.0px;max-width:100%;height:auto;vertical-align:middle\"><br>應滿足下列關係：<\/p><table class=\"source-table\"><tr><td><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-6c5c80060dc5d5969fe2.png\" alt=\"來源圖像 image241.wmf\" style=\"width:127.0px;max-width:100%;height:auto;vertical-align:middle\"><\/p><p>(皆以公里/小時為速率單位)<\/p><\/td><\/tr><\/table><p>而車輛的實際速率就是單位時間內車輛移動的距離，可以利用輪胎轉速與輪胎周長求出。輪胎轉速是指單位時間內輪胎旋轉多少圈，而輪胎周長等於輪胎旋轉一圈時車輛移動的距離，所以有下列關係式：<\/p><table class=\"source-table\"><tr><td><p>實際速率＝輪胎轉速<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9afcf0a31df4052df82f.png\" alt=\"來源圖像 image242.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">輪胎周長<\/p><\/td><\/tr><\/table><p>上式的實際速率若要以公里/小時為單位，則輪胎轉速應以圈/小時為單位，輪胎周長應以公里為單位。<\/p><p>所以當車輛上的儀器測出輪胎轉速，配合儀器內設定的輪胎周長，就能得到時速錶上的指示速率，關係式如下：<\/p><table class=\"source-table\"><tr><td><p>指示速率＝儀器測出的輪胎轉速<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9afcf0a31df4052df82f.png\" alt=\"來源圖像 image243.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">儀器設定的輪胎周長<\/p><\/td><\/tr><\/table><p><div class=\"source-textbox\"><p>&amp;圈/小時為轉速單位，表示每小時轉多少圈<\/p><\/div><\/p><\/td><\/tr><\/table><\/section><div class=\"source-question-part\"><p>題目<\/p><p>根據選文，已知原本甲、乙兩輛車上儀器測出的輪胎轉速跟實際的輪胎轉速相等，兩車儀器設定的輪胎周長也與當時兩車安裝的輪胎周長相等。後來甲的儀器發生故障，導致儀器測出的輪胎轉速比實際的輪胎轉速更高，而乙更換輪胎，新輪胎周長比原本的更小，但儀器設定的仍是原本輪胎周長。若甲、乙此時皆以<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-5ef592dc8ef48f542b23.png\" alt=\"來源圖像 image262.wmf\" style=\"width:22.0px;max-width:100%;height:auto;vertical-align:middle\">公里/小時的指示速率行駛，且甲、乙的實際速率分別為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-db17949bddd189adeb80.png\" alt=\"來源圖像 image263.wmf\" style=\"width:16.0px;max-width:100%;height:auto;vertical-align:middle\">公里/小時、<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-eb031192e1abd0989c92.png\" alt=\"來源圖像 image264.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">公里/小時，則下列關係何者正確？<br>(A)<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-5d340ff8b41336679881.png\" alt=\"來源圖像 image265.wmf\" style=\"width:51.0px;max-width:100%;height:auto;vertical-align:middle\">，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-cc9351f85587a5167f0d.png\" alt=\"來源圖像 image266.wmf\" style=\"width:50.0px;max-width:100%;height:auto;vertical-align:middle\"><br>(B)<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-5d340ff8b41336679881.png\" alt=\"來源圖像 image267.wmf\" style=\"width:51.0px;max-width:100%;height:auto;vertical-align:middle\">，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-775c428adb3c6bee5f5f.png\" alt=\"來源圖像 image268.wmf\" style=\"width:50.0px;max-width:100%;height:auto;vertical-align:middle\"><br>(C)<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-f790b299f4e9094d316f.png\" alt=\"來源圖像 image269.wmf\" style=\"width:51.0px;max-width:100%;height:auto;vertical-align:middle\">，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-cc9351f85587a5167f0d.png\" alt=\"來源圖像 image270.wmf\" style=\"width:50.0px;max-width:100%;height:auto;vertical-align:middle\"><br>(D)<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-f790b299f4e9094d316f.png\" alt=\"來源圖像 image271.wmf\" style=\"width:51.0px;max-width:100%;height:auto;vertical-align:middle\">，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-775c428adb3c6bee5f5f.png\" alt=\"來源圖像 image272.wmf\" style=\"width:50.0px;max-width:100%;height:auto;vertical-align:middle\"><\/p><\/div>","note":"來源：034502_數學科試題分析_國民中學版.docx，本文第28個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":26,"ability":"分析思考"},{"qid":"26","number":26,"kind":"constructed","target":"評量學生是否能在生活情境中，尋找規律並應用等差數列解決問題","basis":"學習表現：n-IV-7、\n學習內容N-8-4","answer":null,"school":1.6,"national":null,"city":null,"deltaNational":null,"deltaCity":null,"groups":{"全體":{"n":450,"rate":1.6,"counts":{"blank":20,"multiple":0,"A":18,"B":221,"C":74,"D":117},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":27},"精熟":{"n":116,"rate":2.2155,"counts":{"blank":0,"multiple":0,"A":1,"B":35,"C":18,"D":62},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":27},"基礎":{"n":235,"rate":1.566,"counts":{"blank":4,"multiple":0,"A":5,"B":131,"C":48,"D":47},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":27},"待加強":{"n":99,"rate":0.9596,"counts":{"blank":16,"multiple":0,"A":12,"B":55,"C":8,"D":8},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":27}},"doc":{"html":"<div class=\"source-question-part\"><p>題目<\/p><p><u>阿川<\/u>想要挑戰一場馬拉松賽事，並在賽前訓練自己的體能。他決定利用每圈<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9762c70a91ae4ae0dd14.png\" alt=\"來源圖像 image273.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">公尺的跑道訓練，並訂定了訓練計畫如下：每週星期一、四訓練，第一週的星期一跑<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-ba72c99412c5f85f765f.png\" alt=\"來源圖像 image274.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈，每週星期四的訓練圈數比當週星期一多<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-4e8335e34304838b575a.png\" alt=\"來源圖像 image275.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈，之後每週星期一的訓練圈數與前一週的星期四相同，直到某日的訓練距離超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image276.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里，就維持該圈數不再增加。<\/p><p>請根據上述資訊回答下列問題，完整寫出你的解題過程並詳細解釋：<\/p><p>(1) 依照訓練計畫，<u>阿川<\/u>第<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-4e8335e34304838b575a.png\" alt=\"來源圖像 image277.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">週的星期四的訓練圈數為幾圈？<\/p><p>(2) 承(1)，最早從<u>第幾週<\/u>的<u>星期幾<\/u>開始，當日的訓練距離會超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image278.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里？<\/p><\/div><details><summary>來源評分指引<\/summary><table class=\"source-table\"><tr><td colspan=\"2\"><p>依據評分規準，各級分評分指引如下：<\/p><\/td><\/tr><tr><td><p>三級分<\/p><\/td><td><p>第一小題正確得出訓練圈數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-83a8677c8bab0e09436e.png\" alt=\"來源圖像 image279.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈，第二小題正確依據跑道長度、訓練圈數、週數、距離之間的關係：<\/p><p>正確利用等差數列一般項公式列出等式或不等式求解，或<\/p><p>正確以數值算式推導或檢驗，或列舉數值關係之規律，找出訓練距離不足及超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image280.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里的週次與星期邊界值，<\/p><p>並根據上述結果判斷出最早為第<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-cf67f94ebd1c7ea0267d.png\" alt=\"來源圖像 image281.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">週星期四。解題步驟呈現完整或大致完整的推導/推理或解釋。<\/p><\/td><\/tr><tr><td><p>二級分<\/p><\/td><td><p>第一小題正確得出訓練圈數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-83a8677c8bab0e09436e.png\" alt=\"來源圖像 image282.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈，第二小題正確依據跑道長度、訓練圈數、週數、距離之間的關係：<\/p><p>正確利用等差數列一般項公式列出等式或不等式求解，但未能正確判斷最早為第<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-cf67f94ebd1c7ea0267d.png\" alt=\"來源圖像 image283.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">週星期四，或<\/p><p>以算式推導或檢驗找出訓練距離不足及超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image284.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里的週次與星期邊界值，解題過程大致完整但缺乏或未能正確包含下列所需重要步驟之一：①訓練距離與圈數的轉換，②不足或超過之邊界值的圈數、週次關係式，③不足或超過之邊界值的訓練距離、週次關係式，或<\/p><p>列舉數值關係之規律找出訓練距離不足及超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image285.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里的週數與星期邊界值，列舉項目完整但發生不影響推論與結果的數算錯誤；或列舉項目大致完整但缺乏或未能正確包含下列重要元素之一：①由題目條件直接得出之首項或經過推導得出之首項，②足夠呈現數值關係規律性之項數，③題目條件推導出之距離不足或超過<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image286.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里的邊界值項目。<\/p><p>第一小題未能正確得出訓練圈數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-83a8677c8bab0e09436e.png\" alt=\"來源圖像 image287.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈，但第二小題達三級分標準。<\/p><\/td><\/tr><tr><td><p>一級分<\/p><\/td><td><p>未達二級分標準，但呈現下列其一：<\/p><p>第一小題正確得出訓練圈數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-83a8677c8bab0e09436e.png\" alt=\"來源圖像 image288.wmf\" style=\"width:13.0px;max-width:100%;height:auto;vertical-align:middle\">圈或訓練距離為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-25069f3139ea07c67f33.png\" alt=\"來源圖像 image289.wmf\" style=\"width:27.0px;max-width:100%;height:auto;vertical-align:middle\">公里。<\/p><p>第二小題呈現非題目已知的解題要素，例如：不足<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd8700c169d4f30ec2b4.png\" alt=\"來源圖像 image290.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公里的最後週次與訓練圈數、星期一或星期四的圈數或訓練距離之一般項。<\/p><\/td><\/tr><tr><td><p>零級分<\/p><\/td><td><p>只有答案或與題目無關。<\/p><p>策略模糊不清或錯誤。<\/p><\/td><\/tr><tr><td colspan=\"2\"><p>備註:各級分樣卷可於國中教育會考官網歷屆試題 (<u>https://cap.rcpet.edu.tw/examination.html<\/u>) 下載。<\/p><\/td><\/tr><\/table><\/details>","note":"來源：034502_數學科試題分析_國民中學版.docx，本文第29個表格。題目與題組材料由Word轉為網頁閱讀版；原Word固定版面未逐頁核验。"},"teaching":null,"sourceRow":27,"ability":null},{"qid":"27","number":27,"kind":"constructed","target":"評量學生是否能應用相似直角三角形邊長比值的不變性與正六邊形的內角度數進行推論並計算邊長","basis":"學習表現：s-IV-12、\n學習內容S-9-4","answer":null,"school":1.1422,"national":null,"city":null,"deltaNational":null,"deltaCity":null,"groups":{"全體":{"n":450,"rate":1.1422,"counts":{"blank":87,"multiple":0,"A":23,"B":222,"C":62,"D":56},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":28},"精熟":{"n":116,"rate":2.1207,"counts":{"blank":1,"multiple":0,"A":0,"B":30,"C":39,"D":46},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":28},"基礎":{"n":235,"rate":1.0298,"counts":{"blank":30,"multiple":0,"A":6,"B":166,"C":23,"D":10},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":28},"待加強":{"n":99,"rate":0.2626,"counts":{"blank":56,"multiple":0,"A":17,"B":26,"C":0,"D":0},"maxWrongRate":null,"maxWrongOptions":[],"highWrongOptions":[],"sourceRow":28}},"doc":{"html":"<div class=\"source-question-part\"><p>題目<\/p><p>某場館有一組由三個相同的五邊形沙發緊密拼成的Y字型沙發椅，如圖(十三)所示，其俯視圖如圖(十四)所示，其中<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9970e4173a9058a87843.png\" alt=\"來源圖像 image291.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bed802e3497cddf1df6a.png\" alt=\"來源圖像 image292.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公分，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-c442d0e1cc752c5d7008.png\" alt=\"來源圖像 image293.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">、<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-5648f37e06755368974f.png\" alt=\"來源圖像 image294.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">皆為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-971ef295e4498aac17cf.png\" alt=\"來源圖像 image295.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">公分，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9cc4cd062fb2fcd30e07.png\" alt=\"來源圖像 image296.wmf\" style=\"width:74.0px;max-width:100%;height:auto;vertical-align:middle\">，<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-51b776262428a778c5f1.png\" alt=\"來源圖像 image297.wmf\" style=\"width:115.0px;max-width:100%;height:auto;vertical-align:middle\">，且<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-36a2e95b53f285848faa.png\" alt=\"來源圖像 image298.wmf\" style=\"width:19.0px;max-width:100%;height:auto;vertical-align:middle\">為Y字型沙發椅的中心點。<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-df45a3a56338ef4601b9.jpg\" alt=\"來源圖像 image299.jpeg\" style=\"width:401.0px;max-width:100%;height:auto;vertical-align:middle\"><\/p><p>圖(十三)                                            圖(十四)<\/p><p>請根據上述資訊回答下列問題，完整寫出你的解題過程並詳細解釋。<\/p><p>求圖(十四)中<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-e42fc12bb930d6631181.png\" alt=\"來源圖像 image300.wmf\" style=\"width:55.0px;max-width:100%;height:auto;vertical-align:middle\">的度數為何？<\/p><p>今想訂製一塊正六邊形的地毯，並將Y字型沙發椅放置在上面，其中正六邊形地毯的對角線交點與<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-36a2e95b53f285848faa.png\" alt=\"來源圖像 image301.wmf\" style=\"width:19.0px;max-width:100%;height:auto;vertical-align:middle\">點重合，擺放時<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9970e4173a9058a87843.png\" alt=\"來源圖像 image302.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">與地毯的一邊平行且至少相距<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-e547945593f2f3abde31.png\" alt=\"來源圖像 image303.wmf\" style=\"width:21.0px;max-width:100%;height:auto;vertical-align:middle\">公分，如圖(十五)所示，則地毯的邊長至少需要多少公分？(以根式呈現)<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-dc3fbd87b3d3af614f34.jpg\" alt=\"來源圖像 image304.jpeg\" style=\"width:327.0px;max-width:100%;height:auto;vertical-align:middle\"><\/p><p>圖(十五)<\/p><\/div><details><summary>來源評分指引<\/summary><table class=\"source-table\"><tr><td colspan=\"2\"><p>依據評分規準，各級分評分指引如下：<\/p><\/td><\/tr><tr><td><p>三級分<\/p><\/td><td><p>第一小題正確呈現<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-e42fc12bb930d6631181.png\" alt=\"來源圖像 image305.wmf\" style=\"width:55.0px;max-width:100%;height:auto;vertical-align:middle\">的度數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image306.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">，且第二小題正確利用<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9bff8885a2a0e66785c8.png\" alt=\"來源圖像 image307.wmf\" style=\"width:111.0px;max-width:100%;height:auto;vertical-align:middle\">直角三角形的邊長比例或畢氏定理，求出<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-14c0c1fbee3805cadccc.png\" alt=\"來源圖像 image308.wmf\" style=\"width:53.0px;max-width:100%;height:auto;vertical-align:middle\">中<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-36a2e95b53f285848faa.png\" alt=\"來源圖像 image309.wmf\" style=\"width:18.0px;max-width:100%;height:auto;vertical-align:middle\">到<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bfbfa243e1ae12fe632f.png\" alt=\"來源圖像 image310.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">垂足<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9329466ee93a0f4874c7.png\" alt=\"來源圖像 image311.wmf\" style=\"width:20.0px;max-width:100%;height:auto;vertical-align:middle\">點的距離<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-03fd50392688f8723a98.png\" alt=\"來源圖像 image312.wmf\" style=\"width:88.0px;max-width:100%;height:auto;vertical-align:middle\">及到正六邊形一邊 (即下方平行<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9970e4173a9058a87843.png\" alt=\"來源圖像 image313.wmf\" style=\"width:31.0px;max-width:100%;height:auto;vertical-align:middle\">的邊)中點<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-bd9f3153703a19bf3ddf.png\" alt=\"來源圖像 image314.wmf\" style=\"width:15.0px;max-width:100%;height:auto;vertical-align:middle\">的距離<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-8dfa4153bbceef0c1e98.png\" alt=\"來源圖像 image315.wmf\" style=\"width:124.0px;max-width:100%;height:auto;vertical-align:middle\">，並求得地毯的邊長至少需要<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d21ba02c703b0ea62364.png\" alt=\"來源圖像 image316.wmf\" style=\"width:85.0px;max-width:100%;height:auto;vertical-align:middle\">公分，解題步驟呈現完整或大致完整的推導/推理或解釋。<\/p><\/td><\/tr><tr><td><p>二級分<\/p><\/td><td><p>第一小題正確呈現<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-e42fc12bb930d6631181.png\" alt=\"來源圖像 image317.wmf\" style=\"width:55.0px;max-width:100%;height:auto;vertical-align:middle\">的度數為<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d9e787e72743af34ed2e.png\" alt=\"來源圖像 image318.wmf\" style=\"width:29.0px;max-width:100%;height:auto;vertical-align:middle\">，且第二小題：<\/p><p><img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9bff8885a2a0e66785c8.png\" alt=\"來源圖像 image319.wmf\" style=\"width:111.0px;max-width:100%;height:auto;vertical-align:middle\">直角三角形的邊長比例出現錯置，但解題過程中的推導/推理或解釋大致完整，或<\/p><p>正確利用<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-9bff8885a2a0e66785c8.png\" alt=\"來源圖像 image320.wmf\" style=\"width:111.0px;max-width:100%;height:auto;vertical-align:middle\">直角三角形的邊長比例或畢氏定理求出解題所需某一線段長度，且此過程中的推導/推理或解釋大致完整，但未能得出地毯的邊長至少需要<img src=\"https://yu-husn.github.io/juren-115-cap-analysis/question-d21ba02c703b0ea62364.png\" alt=\"來源圖像 image321.wmf\" style=\"width:85 taCity":null},{"name":"待加強","school":0.22,"national":0.2527,"city":null,"deltaNational":-0.0327,"deltaCity":null}],"absentRate":0,"nationalN":181013,"chartPage":6,"chart":"question-9197eaf795752d31bec6.png"},{"id":"social","name":"社會","levels":[{"name":"精熟","school":0.22219999999999998,"national":0.21030000000000001,"city":null,"deltaNational":0.01189999999999997,"deltaCity":null},{"name":"基礎","school":0.68,"national":0.6539,"city":null,"deltaNational":0.0261,"deltaCity":null},{"name":"待加強","school":0.0978,"national":0.1358,"city":null,"deltaNational":-0.038,"deltaCity":null}],"absentRate":0,"nationalN":180998,"chartPage":7,"chart":"question-be4dd6e6ab554ffe5560.png"},{"id":"science","name":"自然","levels":[{"name":"精熟","school":0.1867,"national":0.1741,"city":null,"deltaNational":0.0126,"deltaCity":null},{"name":"基礎","school":0.6467,"national":0.6153,"city":null,"deltaNational":0.0314,"deltaCity":null},{"name":"待加強","school":0.16670000000000001,"national":0.21059999999999998,"city":null,"deltaNational":-0.04389999999999997,"deltaCity":null}],"absentRate":0,"nationalN":180726,"chartPage":8,"chart":"question-d574b8e3a410855c5055.png"}],"nationalGradeSource":"https://www.moe.gov.tw/News_Content.aspx?n=9E7AC85F1954DDA8&s=71C3D87BE3D56DE0"};
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite = value => typeof value === 'number' && Number.isFinite(value);
const fixed = value => finite(value) ? value.toFixed(4) : null;
const rate = value => finite(value) ? value.toFixed(4) : '<span class="missing">未提供</span>';
const percent = value => finite(value) ? (value * 100).toFixed(2) + '%' : '未提供';
const mean = values => {const good=values.filter(finite);return good.length ? good.reduce((a,b)=>a+b,0)/good.length : null;};
const pp = value => finite(value) ? `<span class="${value < -1e-10 ? 'value-neg' : value > 1e-10 ? 'value-pos' : 'value-zero'}">${value>1e-10?'+':''}${(Math.abs(value)<1e-10?0:value*100).toFixed(2)}<span class="pp">％</span></span>` : '<span class="missing">未提供</span>';
const subjects = Array.isArray(DATA.subjects) ? DATA.subjects : [];
const state = {subject:subjects[0]?.id, group:subjects[0]?.groups?.find(g=>g.name==='全體')?.name || subjects[0]?.groups?.[0]?.name || '全體', baseline:'national', mode:'all',sort:'qid'};
const current = () => subjects.find(s=>s.id===state.subject) || subjects[0];
const choices = subject => (subject.items||[]).filter(i=>i.kind!=='constructed');
const groupData = item => item.groups?.[state.group] || null;
const optionKeys = subject => subject.id==='listening' ? ['A','B','C'] : ['A','B','C','D'];
const wrongStats = (subject,item,groupName=state.group) => {
 const group=item.groups?.[groupName];
 if(!group || !finite(group.n) || group.n<=0 || !group.counts)return {max:null,options:[],high:[],advantage:[],review:false,exception:false};
 const wrong=optionKeys(subject).filter(k=>k!==item.answer).map(k=>({key:k,count:group.counts[k],rate:finite(group.counts[k])?group.counts[k]/group.n:null})).filter(o=>finite(o.rate));
 const max=wrong.length?Math.max(...wrong.map(o=>o.rate)):null;
 const options=wrong.filter(o=>o.rate>0&&Math.abs(o.rate-max)<1e-12).map(o=>o.key),high=wrong.filter(o=>o.rate>0.2);
 const advantage=['national','city'].filter(b=>finite(difference(item,b))&&difference(item,b)>=0.10);
 const exception=advantage.length>0&&finite(max)&&max>0&&high.length===0;
 return {max,options,high,advantage,review:high.length>0||exception,exception};
};
const difference = (item,baseline) => finite(item.school)&&finite(item[baseline]) ? (baseline==='city'?item.deltaCity:item.deltaNational) : null;
const baselineName = () => state.baseline==='city'?'桃園市':'全國';
const compareItems = (subject,baseline=state.baseline) => choices(subject).filter(i=>finite(i.school)&&finite(i[baseline]));
const hasCompare = (subject,baseline) => compareItems(subject,baseline).length>0;
const sourceName = subject => typeof subject.sourceFile==='string'?subject.sourceFile:(subject.sourceFile?.name||'');
function chooseSubject(id,scroll=false){
 const subject=subjects.find(s=>s.id===id);if(!subject)return;
 state.subject=id;state.group=subject.groups?.find(g=>g.name==='全體')?.name||subject.groups?.[0]?.name||'全體';state.mode='all';state.sort='qid';
 state.baseline=hasCompare(subject,'national')?'national':hasCompare(subject,'city')?'city':'national';render();
 if(scroll)document.getElementById('subject-history').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderOverview(){
 document.getElementById('overview').innerHTML=subjects.map(subject=>{
 const summary=subject.summary||{},val=finite(summary.meanSchool)?summary.meanSchool:mean(choices(subject).map(i=>i.school));
 const benchmarks=[finite(summary.meanNational)?'全國 '+percent(summary.meanNational):'',finite(summary.meanCity)?'桃園市 '+percent(summary.meanCity):''].filter(Boolean).join(' · ');
 const gaps=[['national','學校平均－全國平均',summary.meanNational],['city','學校平均－全縣市平均',summary.meanCity]].map(([key,label,benchmark])=>`<div class="overview-gap" data-gap="${key}"><span>${label}</span><strong>${(key==='national'||key==='city')&&finite(benchmark)?'約 ':''}${pp(finite(val)&&finite(benchmark)?val-benchmark:null)}</strong></div>`).join('');
 return `<button class="overview-card ${subject.id===state.subject?'active':''}" type="button" data-subject="${esc(subject.id)}" aria-pressed="${subject.id===state.subject}"><div class="overview-head"><strong>${esc(subject.name)}</strong><span class="overview-count">${choices(subject).length} 題選擇題</span></div><div class="overview-value number">${percent(val)}<small>學校逐題均值</small></div><div class="rate-track" aria-hidden="true"><span style="width:${finite(val)?Math.max(0,Math.min(100,val*100)):0}%"></span></div><div class="scale" aria-hidden="true"><span>0%</span><span>100%</span></div><div class="overview-benchmarks">${benchmarks||'外部比較資料：未提供'}</div><div class="overview-gaps">${gaps}</div></button>`;
 }).join('');
 document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>chooseSubject(b.dataset.subject,true)));
 document.getElementById('subject-tabs').innerHTML=subjects.map(subject=>`<button type="button" role="tab" aria-selected="${subject.id===state.subject}" data-tab="${esc(subject.id)}">${esc(subject.name)}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>chooseSubject(b.dataset.tab)));
}
const abilityLabel = item => typeof item.ability==='string' && item.ability.trim() ? item.ability.trim() : '分項能力未提供';
const abilityOrder = subject => [...new Set([...(subject.abilityOrder||[]),...choices(subject).map(abilityLabel).filter(x=>x!=='分項能力未提供')])];
function abilityCompare(subject,a,b){
 const order=abilityOrder(subject),rank=i=>abilityLabel(i)==='分項能力未提供'?Infinity:order.indexOf(abilityLabel(i));
 const da=difference(a,'national'),db=difference(b,'national');
 return (rank(a)-rank(b)) || (finite(da)?da:Infinity)-(finite(db)?db:Infinity) || a.number-b.number;
}
function chooseOrder(order){
 state.mode='all';state.sort=order;
 if(order==='national'||order==='city')state.baseline=order;
 if(order==='ability')state.baseline='national';
 renderSubject();
}
function orderMarkup(subject){
 const active=state.mode==='all'?state.sort:null;
 const buttons=[['qid','1. 按照題號少至多排序'],['national','2. 按照學校減全國差距排序，最弱題在前'],['city','3. 按照學校減全縣市差距排序，最弱題在前'],['ability','4. 先按照分項能力排序，再按照學校減全國差距排序'],['wrong','5. 按照錯誤答案最高比例排序']];
 let note='題號由少至多排列。學校與全國／縣市的差距固定採學校全體；錯選比例隨下方群體選擇更新。';
 if(active==='national'||active==='city'){
   const label=active==='national'?'全國':'全縣市（桃園市）';
   note=hasCompare(subject,active)?`依「學校通過率－${label}通過率」由低至高排列，差距最負的題目排在最前面；若全為正值，優勢最小的題目在前。差距相同時依題號排列，缺少比較值的題目置末。`:`本科尚未提供${label}逐題通過率，無法計算差距；目前保留全部題目，暫依題號順序顯示。`;
 }
 if(active==='wrong')note='列出全部選擇題，依目前群體每題最多人選的錯誤選項比例由高至低排序，不設 20% 門檻，也不要求高於全國或縣市。比例相同時按題號排列；0% 仍保留，缺少資料置末。';
 if(active==='ability'){
   const missing=choices(subject).filter(i=>abilityLabel(i)==='分項能力未提供').length;
   note='先依分項能力分組，再於同一能力內依「學校通過率－全國通過率」由低至高排列，最弱題在前；差距相同時按題號排列，缺少比較值置於同組末尾。';
   if(subject.id==='chinese')note+='國文分類順序：語文知識、文意理解、文本評鑑。';
   if(missing)note+=` 本科 ${missing} 題未提供逐題分項能力對照，列於「分項能力未提供」，不以評量目標自行推定分類。`;
 }
 return `<div class="primary-orders" aria-label="五種主要排列方式">${buttons.map(([key,label])=>`<button type="button" data-order="${key}" aria-pressed="${active===key}">${label}</button>`).join('')}</div><p class="order-explanation" role="status">${esc(note)}</p>`;
}
function subjectHighlights(subject){
 const items=choices(subject),national=compareItems(subject,'national'),avg=mean(items.map(i=>i.school));
 const list=[{title:'本科逐題平均通過率',text:`${items.length} 題選擇題的學校平均通過率為 ${percent(avg)}。`+(national.length?`同題全國平均為 ${percent(mean(national.map(i=>i.national)))}，校減國平均 ${(mean(national.map(i=>difference(i,'national')))*100).toFixed(2)} ％（${national.length} 題配對）。`:'尚未提供全國與縣市逐題比較值；此平均不代表總分或跨科排名。')}];
 if(national.length){
   const first=national.slice().sort((a,b)=>difference(a,'national')-difference(b,'national')||a.number-b.number)[0],v=difference(first,'national');
   list.push({title:v<0?'與全國落差較大的題目':v>0?'相對全國優勢較小的題目':'與全國差距最小值為零',text:`第 ${first.qid} 題「${first.target}」學校通過率 ${percent(first.school)}、全國 ${percent(first.national)}，校減國 ${(v*100).toFixed(2)} ％。`});
 }else{
   const first=items.filter(i=>finite(i.school)).sort((a,b)=>a.school-b.school||a.number-b.number)[0];
   list.push({title:'校內通過率較低的題目',text:first?`第 ${first.qid} 題「${first.target}」全體通過率為 ${percent(first.school)}。這是校內作答情形，尚不能判定與全國的差距。`:'未提供可計算的通過率。'});
 }
 const wrong=items.filter(i=>wrongStats(subject,i).review).sort((a,b)=>wrongStats(subject,b).max-wrongStats(subject,a).max||a.number-b.number),first=wrong[0];
 const concentrated=wrong.filter(i=>wrongStats(subject,i).high.length).length,additional=wrong.filter(i=>wrongStats(subject,i).exception).length;
 list.push({title:`錯選重點標記：${state.group}`,text:wrong.length?`符合重點標記 ${wrong.length} 題：${concentrated} 題錯選超過 20%，另 ${additional} 題因學校高於全國或縣市至少 10 ％而標記。最高錯選為第 ${first.qid} 題 ${wrongStats(subject,first).options.join('、')}，各占 ${percent(wrongStats(subject,first).max)}（本組 ${first.groups[state.group].n} 人）。`:'有 0 題符合本次錯選重點標記條件；仍可查看各題通過率與其他群體反應。'});
 return `<section class="subject-highlights" aria-labelledby="subject-highlights-title"><h3 id="subject-highlights-title">${esc(subject.name)}重點發現</h3><div class="highlights">${list.map(x=>`<article class="highlight"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</div></section>`;
}
function shownItems(subject){
 let rows=choices(subject).slice();
 if(state.mode==='lag10')rows=rows.filter(i=>finite(difference(i,state.baseline))).sort((a,b)=>difference(a,state.baseline)-difference(b,state.baseline)||a.number-b.number).slice(0,10);
 if(state.mode==='gaps')rows=rows.filter(i=>finite(difference(i,state.baseline)));
 const sortKey=state.mode==='wrong'?'wrong':state.mode==='lag10'||state.mode==='gaps'?'gap':state.sort;
 rows.sort((a,b)=>{
  if(sortKey==='gap'){const da=difference(a,state.baseline),db=difference(b,state.baseline);return (finite(da)?da:Infinity)-(finite(db)?db:Infinity)||a.number-b.number;}
  if(sortKey==='national'||sortKey==='city'){const da=difference(a,sortKey),db=difference(b,sortKey);return (finite(da)?da:Infinity)-(finite(db)?db:Infinity)||a.number-b.number;}
  if(sortKey==='ability')return abilityCompare(subject,a,b);
  if(sortKey==='school')return (finite(a.school)?a.school:Infinity)-(finite(b.school)?b.school:Infinity)||a.number-b.number;
  if(sortKey==='wrong')return (wrongStats(subject,b).max??-1)-(wrongStats(subject,a).max??-1)||a.number-b.number;
  return a.number-b.number;
 });return rows;
}
function wrongReason(stats){
 const reasons=[];
 if(stats.high.length)reasons.push('錯選 >20%');
 if(stats.advantage.length&&stats.max>0)reasons.push('學校高於'+stats.advantage.map(b=>b==='national'?'全國':'桃園市').join('／')+' ≥10 ％');

}
function wrongCell(subject,item){

 return `<span class="${value.high.length?'wrong-chip':value.exception?'advantage-chip':'wrong-normal'}">${esc(value.options.join('／'))}：${value.options.length>1?'各 ':''}${groupData(item).counts[value.options[0]]}／${groupData(item).n}人（${percent(value.max)}）</span>${value.review?`<small class="wrong-reason">${esc(wrongReason(value))}</small>`:''}`;
}

function deltaAverageCell(rows,baseline){const values=rows.map(i=>difference(i,baseline)).filter(finite);return `${pp(mean(values))}<small>有效配對 ${values.length} 題</small>`;}

</td><td class="numeric">—<small>不平均錯選率</small></td><td></td></tr></tfoot></table></div><p class="table-footnote">全國／桃園市平均僅使用同題學校與該基準皆有效的配對；學校欄使用目前顯示且有學校通過率的題目。差距 = 學校全體通過率 − 比較基準，不將所選等級群體直接與全國全體比較。最高錯選比例＝該錯誤選項人數÷本組有效人數。負值表示學校全體低於基準。選項百分比以該群體人數為分母，包含未作答與複選；${subject.id==='listening'?'聽力以 A、B、C 為實際選項，僅將實際錯誤選項納入最高錯選排序。':'錯誤選項嚴格大於 20% 標示集中錯選。這是本網頁教學標記，並非官方認定門檻。'} 若學校全體通過率高於全國或桃園市任一基準至少 10 ％，該題本組有實際錯選時另標示最高錯選選項（可 ≤20%）。缺少比較值不套用例外，「最多錯誤選項檢視」仍列出全部選擇題（含 0%），不受上述標記條件限制。</p>`;
}

}

function optionCell(group,key,answer,constructed,listening,reviewStats){
 const count=group?.counts?.[key],proportion=finite(count)&&finite(group?.n)&&group.n>0?count/group.n:null;
 let cls='';
 if(listening&&key==='D')cls='record-only';
 else if(!constructed&&key===answer)cls='correct';
 else if(!constructed&&['A','B','C','D'].includes(key)&&key!==answer&&finite(proportion)&&proportion>0.2)cls='high-wrong';
 else if(!constructed&&reviewStats?.exception&&reviewStats.options.includes(key))cls='advantage-wrong';
 return `<td class="${cls}">${finite(count)?count:'—'}<small>${percent(proportion)}</small></td>`;
}

function teachingForQuestion(subject,item){
 const constructed=item.kind==='constructed',group=item.groups?.['全體'];
 const formatGap=b=>{const value=difference(item,b);return finite(value)?`${b==='national'?'校減全國':'校減桃園市'} ${(value*100).toFixed(2)}％`:`${b==='national'?'全國':'桃園市'}比較資料未提供`};
 let fact;
 if(constructed){
  const counts=group?.counts;
  fact=`學校全體平均得分${finite(item.school)?item.school.toFixed(4)+'分（滿分3分）':'未提供'}。`+
   (counts?['A','B','C','D'].map((k,i)=>`${i}分：${finite(counts[k])?counts[k]+'人':'未提供'}`).join('；')+'。':'得分分布未提供。');
 }else{
  const w=wrongStats(subject,item,'全體');
  fact=`全體通過率${percent(item.school)}；`+(w.options.length?`最高錯選${w.options.join('、')}，各占${percent(w.max)}`:finite(w.max)?'未有實際錯選':'錯選資料未提供')+`；${formatGap('national')}；${formatGap('city')}。`;
 }
 const focus=item.target||item.basis||'本題對應能力';
 const fallback={
  fact,
  hypothesis:constructed?`得分分布可作為檢視「${focus}」的線索。需查看學生的計算、推理與表達步驟，才能區分觀念理解、運算或書寫上的困難。`:`選項分布可作為檢視「${focus}」的線索；尚不能單由選答判定錯誤原因。`,
  action:constructed?'請學生逐步說明解題策略，依評分規準對照完整與部分給分作答；針對缺漏步驟示範修正，再以同能力短題確認理解。':
   subject.id==='listening'?'重播本題對應音檔，請學生說明聽到的關鍵訊息並對照選項；確認誤聽或語意理解的可能問題，再以相近情境檢核。':
   subject.id==='math'?'請學生呈現解題步驟，對照正答與主要錯選，檢查概念、運算及題意理解；再以同分項能力短題檢核。':
   '請學生口述解題依據，對照正答與主要錯選，標出題目或題組中的證據；以同評量目標的短題再次檢查理解。'
 };
 return {fact:item.teaching?.fact||fallback.fact,hypothesis:item.teaching?.hypothesis||fallback.hypothesis,action:item.teaching?.action||fallback.action};
}

${constructed?'':`<div class="notice">錯選重點標記採兩個條件擇一（不作為全部題目排序的篩選門檻）：本組單一錯誤選項 >20%；或學校全體通過率高於全國／桃園市任一基準至少 10 ％，且本組有實際錯選。後者即使最高錯選 ≤20% 也另外標示，不稱為集中錯選。20%與10％為本網頁教學標記，並非官方判定標準；錯選原因仍需搭配學生說明確認。<br>${['national','city'].filter(b=>finite(difference(item,b))).map(b=>`校減${b==='national'?'全國':'桃園市'}：${(difference(item,b)*100).toFixed(2)} ％`).join('；')||'本題未提供外部比較值，無法套用高於基準的例外。'}</div>`}</section>${teaching?`<section class="detail-section"><h3>教學檢視</h3><div class="teaching-grid"><div class="teaching-box"><h4>數據事實</h4><p>${esc(teaching.fact||'未提供')}</p></div><div class="teaching-box"><h4>待驗證的可能原因</h4><p>${esc(teaching.hypothesis||'需搭配作答歷程確認。')}</p></div><div class="teaching-box"><h4>教學行動建議</h4><p>${esc(teaching.action||'未提供')}</p></div></div></section>`:''}`;
 if(item.doc?.html)document.getElementById('doc-fragment').innerHTML=item.doc.html;

function trendChange(row,year){
 const now=row.years.find(x=>x.year===115).gap,old=row.years.find(x=>x.year===year).gap;
 const delta=now-old,amount=(Math.abs(delta)*100).toFixed(0);
 if(Math.abs(delta)<1e-9)return '差距持平';
 if(now<=0&&old<=0)return `落差${delta>0?'縮小':'擴大'} ${amount} ％（${delta>0?'變強':'變弱'}）`;
 if(now>=0&&old>=0)return `優勢${delta>0?'擴大':'縮小'} ${amount} ％`;
 return `由${old<0?'落後轉為領先':'領先轉為落後'}（差距${delta>0?'增加':'減少'} ${amount} ％）`;
}
function historyMarkup(subject){
 const rows=subject.abilityHistory||[];
 if(!rows.length)return '';
 return `<section class="panel lower-panel ability-history" aria-labelledby="history-title"><h3 id="history-title">${esc(subject.name)}｜近三年分項能力比較</h3><p class="small muted">來源：各科分項能力通過率分析。依官方分項能力報告呈現，不以本頁逐題均值替代。</p><div class="table-wrap"><table class="history-table"><thead><tr><th>分項能力</th>${[113,114,115].map(y=>`<th>${y} 年</th>`).join('')}<th>115 年較 114 年</th><th>115 年較 113 年</th></tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.ability)}</th>${r.years.map(y=>`<td><div>學校 <strong>${(y.school*100).toFixed(0)}%</strong></div><div>全國 ${(y.national*100).toFixed(0)}%</div><div>校減國 ${pp(y.gap)}</div></td>`).join('')}<td>${trendChange(r,114)}</td><td>${trendChange(r,113)}</td></tr>`).join('')}</tbody></table></div><p class="small muted history-note">各年為不同屆學生、不同試題；差距變化描述相對全國的位置，不能視為同一批學生的進步或退步。來源通過率保留兩位小數，差距及變化以來源精度計算。</p></section>`;
}
function renderGrades(){
 const grades=DATA.gradeOverview||[];
 document.getElementById('grade-overview').innerHTML=`<div class="section-heading"><div><h2>五科精熟、基礎、待加強等級比較</h2><p class="small muted">英語採正式「整體能力」等級；不將閱讀、聽力比例平均。</p></div></div><div class="panel"><div class="table-wrap"><table class="grade-table"><thead><tr><th>科目</th><th>等級</th><th class="numeric">學校</th><th class="numeric">全國</th><th class="numeric">桃園市</th><th class="numeric">學校－全國</th><th class="numeric">學校－桃園市</th></tr></thead><tbody>${grades.map(s=>s.levels.map((g,i)=>`<tr>${i===0?`<th scope="rowgroup" rowspan="3">${esc(s.name)}<small class="grade-absent">缺考率 ${percent(s.absentRate)}</small></th>`:''}<th scope="row">${esc(g.name)}</th><td class="numeric">${percent(g.school)}</td><td class="numeric">${percent(g.national)}</td><td class="numeric">${finite(g.city)?percent(g.city):'<span class="missing">未提供</span>'}</td><td class="numeric">${pp(g.deltaNational)}</td><td class="numeric">${finite(g.deltaCity)?pp(g.deltaCity):'<span class="missing">無法計算</span>'}</td></tr>`).join('')).join('')}</tbody></table></div><div class="grade-notes"><p>學校等級比例以本科有效作答人數為分母，扣除缺考及重大違規；缺考率另列。國文、數學、社會、自然的分組人數已與正式比例核對。英語整體比例直接引用正式報告。比例四捨五入後合計可能不是 100%。</p><p>全國採<a href="${esc(DATA.nationalGradeSource)}" target="_blank" rel="noopener">教育部115年各科等級加標示人數百分比統計表</a>，有效人數：${grades.map(s=>`${esc(s.name)} ${s.nationalN.toLocaleString()} 人`).join('、')}。此公開統計口徑與學力品質監控逐題報告不完全相同；不混用兩者分母。桃園市精確等級比例及有效人數尚未提供。</p><p>差距單位為％，正負僅表示該等級比例較高或較低；待加強比例較高不代表表現較好。桃園市精確等級比例未提供，不由閱讀／聽力比例或長條圖推算。缺考率不得加進各等級比例。</p><details class="official-grade-charts"><summary>查看五科官方學校／全國／桃園市比較原圖</summary><div class="grade-chart-grid">${grades.map(s=>`<figure><figcaption>${esc(s.name)}（學生成績報告第 ${s.chartPage} 頁）</figcaption><img src="${s.chart}" alt="${esc(s.name)}官方等級比例比較圖，包含全國、桃園市及學校；縣市未標示精確數值" loading="lazy"></figure>`).join('')}</div></details></div></div>`;
}

function renderMethods(){
 const issues=(DATA.issues||[]).filter(issue=>!(issue.subject==='英文聽力'&&issue.field==='來源D欄紀錄'));
 document.getElementById('methods').innerHTML=`<details class="collapsible"><summary>來源與分析方法</summary><div class="collapsible-content"><section class="guide-summary" aria-labelledby="guide-summary-title" style="margin-bottom:24px"><h3 id="guide-summary-title">《國中教育會考學力品質監控資料【國民中學版】使用說明》摘要</h3><p class="small muted" style="margin-top:6px">依心測中心國民中學版使用說明整理。四類資料由整體學力、分項能力、逐題通過率到選項反應，協助教師找出學習優勢與弱點，作為調整教學的參考。</p><ul><li><strong>學生成績報告：</strong>提供學校基本資料、各科各等級人數百分比與表現描述；比較學校、全國與所在縣市的學力狀況。本網頁對應「五科精熟、基礎、待加強等級比較」。</li><li><strong>各科分項能力通過率分析：</strong>提供近三年學校與全國各分項能力通過率，以全國平均為參照觀察變化。若某能力低於全國且差距逐年擴大，可列為優先補強方向。本網頁對應「五科近三年分項能力比較」。</li><li><strong>各科試題通過率分析：</strong>提供每題的分項能力、評量目標及學校、縣市、全國通過率，供教師篩選需討論的題目。使用說明舉例可篩選學校通過率低於 0.5（50%），或低於縣市通過率的題目；這些是篩選示例，不是統一判定標準。本網頁以逐題差距及分項能力排序支援檢視。</li><li><strong>各科試題分析：</strong>提供完整試題、評量目標、命題依據、通過率、鑑別度及各選項選答人次。教師可比較全體與不同程度群體的作答，從低通過率題目的選項分布探討可能的迷思概念，並調整教學。本網頁對應逐題「查看」詳情。</li></ul><p class="small muted">檔案形式依實際提供內容；PDF與Excel用於核對，Word用於保留試題與圖片。</p><div class="notice"><strong>本網頁補充判讀：</strong>不同年度為不同屆學生及試題，跨年差距不能視為同一批學生的成長；錯選只能提供待確認的線索，需搭配作答說明與課堂觀察。英文聽力僅有 A、B、C 選項及基礎、待加強兩等級。「錯選 &gt;20%」等醒目標記為本網頁設定，並非使用說明所訂門檻。</div></section><div class="method-columns"><div><h3>計算與判讀</h3><ul><li>選擇題通過率以來源資料為準；表中率值使用 0–1，顯示四位小數。</li><li>選擇題逐題均值採有效題目算術平均，不換算為測驗總分。</li><li>差距以同題有效配對計算：100 ×（學校通過率 − 比較基準通過率），單位為％。</li><li>「最多錯誤選項檢視」列出全部選擇題，按本組每題最高錯選率由高至低排列，含低於 20% 與 0% 的題目；缺少資料置末。錯選重點標記符合任一條件即標示：① 本組單一錯誤選項人次 ÷ 本組人數 >20%；② 學校全體通過率－全國或縣市通過率 ≥0.10，且本組有實際錯選。第二種情況標示最高錯選，不要求 >20%。</li><li>「高出10%」依通過率相減解讀為至少10％，例如80%－70%=10％；全國、縣市任一符合即可，不受檢視基準選單影響。正答、未作答、複選與非實際選項不納入錯選條件。</li><li>未作答與複選另列紀錄；英文聽力僅呈現 A、B、C 三個選項，等級僅分基礎、待加強。</li><li>數學非選擇題以平均得分與分數分布獨立呈現，不混入通過率均值。</li></ul></div><div><h3>資料限制與判讀邊界</h3><ul>${(DATA.limitations||[]).map(note=>`<li>${esc(note)}</li>`).join('')}</ul></div></div></div><div class="table-wrap"><table class="sources-table"><thead><tr><th>來源檔案</th><th>用途</th></tr></thead><tbody>${(DATA.sources||[]).map(source=>`<tr><td>${esc(source.name)}</td><td>${esc(source.role)}</td></tr>`).join('')}</tbody></table></div></details><details class="collapsible"><summary>資料核對與例外記錄（${issues.length} 項）</summary><div class="collapsible-content"><h3>核對結果</h3><ul>${(DATA.verification||[]).map(note=>`<li>${esc(note.replaceAll('30%','20%'))}</li>`).join('')}<li>英文聽力僅有 A、B、C 三個選項，能力等級為基礎、待加強；來源 D 欄不列為本報告的資料例外。</li></ul>${!issues.length?'<p class="small muted">未列出需另行註記的資料例外。</p>':''}</div>${issues.length?`<div class="table-wrap"><table class="issues-table"><thead><tr><th>科目</th><th>題號</th><th>欄位</th><th>核對說明</th></tr></thead><tbody>${issues.map(issue=>`<tr><td>${esc(issue.subject)}</td><td>${esc(issue.qid||'—')}</td><td>${esc(issue.field)}</td><td>${esc(issue.message)}</td></tr>`).join('')}</tbody></table></div>`:''}</details>`;
}
let printBackup=null;
function printSubject(){
 const dialog=document.getElementById('item-dialog');if(dialog.open)dialog.close();
 printBackup=null;
 requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
}
window.addEventListener('afterprint',()=>{if(printBackup){Object.assign(state,printBackup);printBackup=null;renderSubject();}});
function render(){renderOverview();renderSubject();}
const reportTitle=(DATA.school||'學校名稱')+(DATA.year||115)+'會考成績分析';
document.title=reportTitle;
document.getElementById('report-title').textContent=reportTitle;
document.getElementById('school-line').textContent='學校代碼 '+(DATA.schoolCode||'未提供');
document.getElementById('print-top').addEventListener('click',printSubject);
document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('item-dialog').close());
document.getElementById('item-dialog').addEventListener('click',event=>{if(event.target===event.currentTarget){const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.currentTarget.close();}});
render();renderMethods();renderGrades();
</script>
</body>
</html>
